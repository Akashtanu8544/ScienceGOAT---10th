<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#003299" />
      <stop offset="50%" stop-color="#001C6E" />
      <stop offset="100%" stop-color="#000E3D" />
    </linearGradient>

    <!-- G Logo Gradient -->
    <linearGradient id="gGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background App Icon Box -->
  <rect width="512" height="512" rx="105" fill="url(#bgGrad)" />

  <!-- Graduation Cap (Mortarboard) Top Layer -->
  <g transform="translate(0, 8)">
    <!-- Cap Diamond Top -->
    <polygon points="256,48 355,80 256,112 157,80" fill="#FFFFFF" filter="url(#dropShadow)"/>
    <!-- Cap Skull Band -->
    <path d="M 202,96 L 202,122 C 202,136 226,146 256,146 C 286,146 310,136 310,122 L 310,96 Z" fill="#FFFFFF" />
    <!-- Tassel String and Knob -->
    <path d="M 332,88 L 344,128 L 344,152" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="344" cy="152" r="5" fill="#FFFFFF" />
    <path d="M 338,154 L 350,154 L 352,180 L 336,180 Z" fill="#FFFFFF" />
  </g>

  <!-- Stylized G Logo -->
  <path d="M 292,185 C 292,150 264,130 220,130 C 168,130 132,170 132,225 C 132,280 168,318 220,318 C 266,318 296,288 300,242 L 226,242 L 226,204 L 342,204 L 342,216 C 342,288 290,352 218,352 C 138,352 84,292 84,222 C 84,144 142,86 226,86 C 288,86 336,122 348,185 Z" fill="url(#gGrad)"/>

  <!-- Typography -->
  <text x="256" y="324" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Science</text>

  <text x="256" y="388" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" fill="#00E5FF" text-anchor="middle" letter-spacing="3">GOAT</text>

  <!-- Yellow Badge 10th -->
  <rect x="180" y="416" width="152" height="54" rx="27" fill="#FFCC00" />
  <text x="256" y="456" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" fill="#000000" text-anchor="middle">10th</text>

  <!-- Sparkle Star Bottom Right -->
  <path d="M 448,435 C 448,445 453,450 463,450 C 453,450 448,455 448,465 C 448,455 443,450 433,450 C 443,450 448,445 448,435 Z" fill="#93C5FD" opacity="0.75"/>
</svg>
