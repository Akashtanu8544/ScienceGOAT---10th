<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0092FF"/>
      <stop offset="60%" stop-color="#00C853"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>

    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="hornGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5A93C"/>
      <stop offset="100%" stop-color="#9A5B13"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect x="15" y="15" width="470" height="470" rx="90" fill="#FFFFFF" filter="url(#shadow)" />

  <!-- Outer Gradient Ring -->
  <path d="M 125,120 A 175,175 0 1,1 375,120 M 390,360 A 175,175 0 0,1 110,360" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-linecap="round" />

  <!-- Top Left: Atom Model -->
  <g transform="translate(65, 105)">
    <ellipse cx="40" cy="40" rx="36" ry="13" transform="rotate(30 40 40)" fill="none" stroke="#0284C7" stroke-width="4"/>
    <ellipse cx="40" cy="40" rx="36" ry="13" transform="rotate(-30 40 40)" fill="none" stroke="#0284C7" stroke-width="4"/>
    <ellipse cx="40" cy="40" rx="36" ry="13" transform="rotate(90 40 40)" fill="none" stroke="#0284C7" stroke-width="4"/>
    <circle cx="40" cy="40" r="8" fill="#0284C7"/>
  </g>

  <!-- Top Right: Science Beaker / Flask -->
  <g transform="translate(345, 95)">
    <!-- Flask Body -->
    <path d="M 35,15 L 45,15 L 45,32 L 68,75 A 10,10 0 0,1 59,90 L 21,90 A 10,10 0 0,1 12,75 L 35,32 Z" fill="none" stroke="#0F172A" stroke-width="5" stroke-linejoin="round"/>
    <!-- Liquid -->
    <path d="M 23,68 Q 40,62 57,68 L 60,78 A 5,5 0 0,1 55,85 L 25,85 A 5,5 0 0,1 20,78 Z" fill="url(#flaskGrad)"/>
    <!-- Bubbles -->
    <circle cx="34" cy="52" r="3" fill="#34D399"/>
    <circle cx="46" cy="42" r="2.5" fill="#34D399"/>
    <circle cx="40" cy="30" r="2" fill="#34D399"/>
  </g>

  <!-- Top Center: GOAT Head with Glasses & Horns -->
  <g transform="translate(155, 42)">
    <!-- Left Horn -->
    <path d="M 62,65 C 50,45 32,25 10,32 C -5,37 5,58 28,60 C 42,61 55,70 60,75 Z" fill="url(#hornGrad)" stroke="#78350F" stroke-width="2"/>
    <path d="M 20,38 C 25,48 35,55 45,60" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 30,32 C 34,40 42,48 50,52" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>

    <!-- Right Horn -->
    <path d="M 128,65 C 140,45 158,25 180,32 C 195,37 185,58 162,60 C 148,61 135,70 130,75 Z" fill="url(#hornGrad)" stroke="#78350F" stroke-width="2"/>
    <path d="M 170,38 C 165,48 155,55 145,60" fill="none" stroke="#78350F" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 160,32 C 156,40 148,48 140,52" fill="none" stroke="#78350F" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Ear -->
    <path d="M 52,80 C 25,82 10,105 32,112 C 45,110 54,96 58,88 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <path d="M 45,86 C 28,90 20,102 32,106 C 40,104 46,96 48,92 Z" fill="#F472B6" opacity="0.6"/>

    <!-- Right Ear -->
    <path d="M 138,80 C 165,82 180,105 158,112 C 145,110 136,96 132,88 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3"/>
    <path d="M 145,86 C 162,90 170,102 158,106 C 150,104 144,96 142,92 Z" fill="#F472B6" opacity="0.6"/>

    <!-- Goat Head Face -->
    <path d="M 56,72 C 56,50 134,50 134,72 C 138,115 125,160 95,178 C 65,160 52,115 56,72 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Beard -->
    <path d="M 82,172 L 95,200 L 108,172 Z" fill="#FFFFFF" stroke="#334155" stroke-width="3" stroke-linejoin="round"/>

    <!-- Eyes -->
    <circle cx="74" cy="100" r="6" fill="#0F172A"/>
    <circle cx="116" cy="100" r="6" fill="#0F172A"/>
    <circle cx="76" cy="98" r="2" fill="#FFFFFF"/>
    <circle cx="118" cy="98" r="2" fill="#FFFFFF"/>

    <!-- Muzzle / Nose / Mouth -->
    <polygon points="95,122 86,134 104,134" fill="#78350F"/>
    <path d="M 95,134 L 95,145 M 88,145 Q 95,152 102,145" fill="none" stroke="#334155" stroke-width="3" stroke-linecap="round"/>

    <!-- Glasses (Nerd Spectacles) -->
    <rect x="52" y="86" width="38" height="28" rx="8" fill="none" stroke="#0F172A" stroke-width="5"/>
    <rect x="100" y="86" width="38" height="28" rx="8" fill="none" stroke="#0F172A" stroke-width="5"/>
    <line x1="90" y1="96" x2="100" y2="96" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>
    <line x1="42" y1="94" x2="52" y2="94" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
    <line x1="138" y1="94" x2="148" y2="94" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Center Text: "SCIENCE" -->
  <text x="250" y="262" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="56" fill="#0F294A" letter-spacing="1">SCIENCE</text>

  <!-- Center Text: "GOAT" -->
  <text x="250" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="82" fill="#65C400" letter-spacing="1">GOAT</text>

  <!-- Bottom Accent Line & Text "- 10th -" -->
  <g transform="translate(0, 370)">
    <line x1="135" y1="28" x2="180" y2="28" stroke="#00C853" stroke-width="4" stroke-linecap="round"/>
    <text x="250" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Arial Black', sans-serif" font-weight="900" font-size="46" fill="#0F294A">10<tspan font-size="28" dy="-16">th</tspan></text>
    <line x1="320" y1="28" x2="365" y2="28" stroke="#00C853" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Bottom Left: Microscope -->
  <g transform="translate(42, 310)">
    <rect x="10" y="110" width="60" height="12" rx="4" fill="#0F172A"/>
    <rect x="32" y="70" width="16" height="42" rx="3" fill="#0284C7"/>
    <path d="M 25,25 C 25,50 45,65 45,75" fill="none" stroke="#0F172A" stroke-width="8" stroke-linecap="round"/>
    <rect x="12" y="15" width="16" height="30" rx="3" transform="rotate(-25 20 20)" fill="#0F172A"/>
    <rect x="22" y="60" width="36" height="6" rx="2" fill="#0F172A"/>
  </g>

  <!-- Bottom Right: Stack of Books -->
  <g transform="translate(340, 365)">
    <!-- Bottom Book (Gold/Orange) -->
    <path d="M 10,65 L 85,65 L 90,80 L 15,80 Z" fill="#D97706"/>
    <path d="M 15,80 L 90,80 L 85,88 L 10,88 Z" fill="#F59E0B"/>
    <!-- Middle Book (Green) -->
    <path d="M 12,45 L 87,45 L 92,60 L 17,60 Z" fill="#059669"/>
    <path d="M 17,60 L 92,60 L 87,68 L 12,68 Z" fill="#10B981"/>
    <!-- Top Book (Blue) -->
    <path d="M 15,25 L 90,25 L 95,40 L 20,40 Z" fill="#1D4ED8"/>
    <path d="M 20,40 L 95,40 L 90,48 L 15,48 Z" fill="#3B82F6"/>
  </g>
</svg>
